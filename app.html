<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Conversor de básicos</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Conversor%20de%20b%C3%A1sicos%22%2C%22short_name%22%3A%22Conversor%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230d1128%22%2C%22theme_color%22%3A%22%230d1128%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22conversor-icon%20(1).png%22%2C%22sizes%22%3A%22180x180%22%2C%22type%22%3A%22image/png%22%7D%2C%7B%22src%22%3A%22conversor-icon-512%20(1).png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image/png%22%7D%5D%7D">
<link rel="icon" type="image/png" sizes="32x32" href="conversor-favicon%20(1).png">
<link rel="apple-touch-icon" sizes="180x180" href="conversor-icon%20(1).png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="conversor-icon%20(1).png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conversor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1128;
    --bg-2:#121736;
    --card:rgba(255,255,255,0.045);
    --card-2:rgba(255,255,255,0.07);
    --border:rgba(255,255,255,0.1);
    --text:#eef1fb;
    --muted:#8b93b8;
    --muted-2:#5f6790;
    --accent:#2dd4ff;

    --c-nexa:#3b6dff;
    --c-ppg:#5aa5ff;
    --c-mmy:#ff3b5c;
    --c-quik:#a4acc9;
    --c-value:#a855f7;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
    position:relative;
    overflow-x:hidden;
  }
  body::before, body::after{
    content:'';
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    z-index:0;
    pointer-events:none;
    opacity:0.5;
  }
  body::before{
    width:420px; height:420px;
    top:-140px; left:-100px;
    background:radial-gradient(circle, rgba(45,212,255,0.35), transparent 70%);
    animation:drift1 16s ease-in-out infinite alternate;
  }
  body::after{
    width:460px; height:460px;
    bottom:-160px; right:-120px;
    background:radial-gradient(circle, rgba(168,85,247,0.3), transparent 70%);
    animation:drift2 18s ease-in-out infinite alternate;
  }
  @keyframes drift1{to{transform:translate(40px, 30px);}}
  @keyframes drift2{to{transform:translate(-30px, -40px);}}
  @media (prefers-reduced-motion: reduce){
    body::before, body::after{animation:none;}
  }
  .wrap{width:100%;max-width:460px; position:relative; z-index:1;}

  /* ---------- HEADER ---------- */
  .eyebrow{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.12em;
    color:var(--muted-2);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .eyebrow .rule{flex:1;height:1px;background:var(--border);}

  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:36px;
    line-height:1.02;
    letter-spacing:-0.01em;
    margin:0 0 6px;
  }
  h1 span{
    color:var(--accent);
    text-shadow:0 0 22px rgba(45,212,255,0.55);
  }

  p.sub{
    color:var(--muted);
    font-size:13.5px;
    line-height:1.5;
    margin:0 0 26px;
    max-width:34ch;
  }

  /* ---------- SEARCH ---------- */
  .search-box{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .input-shell{
    flex:1;
    position:relative;
    display:flex;
    align-items:center;
    background:var(--card);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border);
    border-radius:16px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input-shell:focus-within{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(45,212,255,0.15), 0 0 24px rgba(45,212,255,0.2);
  }
  .input-shell::before{
    content:'#';
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    color:var(--muted-2);
    padding-left:16px;
  }
  input[type=text]{
    flex:1;
    width:100%;
    padding:15px 14px 15px 6px;
    border:none;
    background:transparent;
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    font-weight:600;
    letter-spacing:0.02em;
    outline:none;
  }
  input[type=text]::placeholder{color:var(--muted-2); font-weight:500;}

  .mic-btn{
    width:52px;
    height:52px;
    padding:0;
    border-radius:16px;
    background:var(--card);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  .mic-btn:active{transform:scale(0.94);}
  .mic-btn svg{width:20px;height:20px;fill:var(--text);}
  .mic-btn.listening{
    background:var(--accent);
    border-color:var(--accent);
    box-shadow:0 0 26px rgba(45,212,255,0.55);
    animation:pulse 1.1s infinite;
  }
  .mic-btn.listening svg{fill:#0d1128;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(45,212,255,0.45);}
    70%{box-shadow:0 0 0 14px rgba(45,212,255,0);}
    100%{box-shadow:0 0 0 0 rgba(45,212,255,0);}
  }

  button#searchBtn{
    display:none;
  }

  .mic-status{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 20px 2px;
    height:0;
    opacity:0;
    overflow:hidden;
    transition:opacity .15s ease;
  }
  .mic-status.show{
    height:auto;
    opacity:1;
    margin-top:8px;
  }
  .mic-status .rec-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
    animation:blink 1s infinite;
  }
  @keyframes blink{50%{opacity:0.2;}}

  /* ---------- RESULT ---------- */
  .result-card{display:none; margin-top:22px;}
  .result-card.show{display:block;}

  .found-brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:16px;
    padding-bottom:14px;
    border-bottom:1px dashed var(--border);
  }
  .found-brand .tag{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted-2);
  }
  .found-brand .val{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:-0.005em;
  }

  .swatch-list{display:flex; flex-direction:column; gap:8px;}

  .swatch{
    position:relative;
    display:flex;
    align-items:stretch;
    background:var(--card);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    opacity:0;
    transform:translateY(8px);
    animation:riseIn .35s ease forwards;
  }
  .swatch:nth-child(1){animation-delay:.02s;}
  .swatch:nth-child(2){animation-delay:.08s;}
  .swatch:nth-child(3){animation-delay:.14s;}
  .swatch:nth-child(4){animation-delay:.20s;}
  .swatch:nth-child(5){animation-delay:.26s;}
  @keyframes riseIn{to{opacity:1; transform:translateY(0);}}

  .swatch .bar{width:6px; flex-shrink:0;}
  .swatch .body{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 16px;
    gap:10px;
  }
  .swatch .brand-name{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .swatch .ref{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:21px;
    letter-spacing:-0.01em;
  }
  .swatch.missing .body{opacity:0.55;}
  .swatch.missing .ref{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    font-style:normal;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--muted-2);
  }
  .swatch.missing .bar{
    background:repeating-linear-gradient(
      -45deg,
      var(--border), var(--border) 4px,
      var(--card-2) 4px, var(--card-2) 8px
    );
  }

  /* ---------- EMPTY STATE ---------- */
  .empty-msg{
    display:none;
    align-items:center;
    gap:12px;
    margin-top:22px;
    padding:18px;
    background:var(--card);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border);
    border-radius:14px;
    color:var(--muted);
    font-size:13.5px;
    line-height:1.5;
  }
  .empty-msg.show{display:flex;}
  .empty-msg svg{width:22px; height:22px; flex-shrink:0; stroke:var(--muted-2); fill:none;}

  /* ---------- FOOTER / LEGEND ---------- */
  .legend{
    margin-top:36px;
    padding-top:18px;
    border-top:1px solid var(--border);
  }
  .legend-title{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted-2);
    margin-bottom:12px;
  }
  .legend-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(96px, 1fr));
    gap:8px;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.03em;
    color:var(--muted);
  }
  .legend-dot{
    width:8px; height:8px; border-radius:50%; flex-shrink:0;
    box-shadow:0 0 8px currentColor;
  }

  .hint{
    color:var(--muted-2);
    font-size:11.5px;
    font-family:'JetBrains Mono',monospace;
    margin-top:14px;
    text-align:center;
    letter-spacing:0.02em;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">
    <span>BASE DE DATOS PROPIA</span>
    <span class="rule"></span>
    <span id="totalBrands"></span> MARCAS
  </div>

  <h1>Conversor<br>de <span>básicos</span></h1>
  <p class="sub">Escribe o dicta cualquier referencia y te muestro su equivalente en el resto de marcas.</p>

  <div class="search-box">
    <div class="input-shell">
      <input type="text" id="searchInput" placeholder="T421, 8975, XR10..." autofocus autocomplete="off" autocapitalize="characters">
    </div>
    <button class="mic-btn" id="micBtn" title="Dictar referencia">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
    <button id="searchBtn">Buscar</button>
  </div>
  <div class="mic-status" id="micStatus"><span class="rec-dot"></span>Escuchando</div>

  <div class="result-card" id="resultCard">
    <div class="found-brand">
      <span class="tag">Localizada en</span>
      <span class="val" id="foundBrand"></span>
      <span class="tag">·</span>
      <span class="val" id="foundRef"></span>
    </div>
    <div class="swatch-list" id="swatchList"></div>
  </div>

  <div class="empty-msg" id="emptyMsg">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span>No se ha encontrado esa referencia en ninguna marca. Revisa el código e inténtalo de nuevo.</span>
  </div>

  <div class="legend">
    <div class="legend-title">Marcas en la base</div>
    <div class="legend-grid" id="legendGrid"></div>
  </div>

  <p class="hint"><span id="totalRows"></span> referencias indexadas</p>
</div>

<script>
const DATA = {"brands": ["NEXA", "PPG", "MMY", "QUIKLINE", "VALUE-PRO"], "rows": [["8900", "T400", "E100", "6000", "5001"], ["8902", "T402", "E120", "6002", "5002"], ["HE02", "T403", "E130", "6003", "5003"], ["8904", "T404", "E903", "6050", "5101"], ["HE03", "T405", "E711", "6051", "5102"], ["8933", "T406", "E902", "6052", "5103"], ["8950", "T407", "E904", "6053", "5104"], ["8948", "T409", "E980", "6054", "5105"], ["8957", "T411", "E752", "6103", "5201"], ["8916", "T412", "E735", "6104", "5202"], ["8953", "T413", "E730", "6105", "5203"], ["8930", "T414", "E725", "6106", "5204"], ["8910", "T415", "E740", "6107", "5205"], ["8911", "T420", "E780", "", ""], ["8975", "T421", "E620", "6308", "5401"], ["8905", "T422", "E261", "6211", "5301"], ["8918", "T423", "E262", "6212", "5302"], ["8984", "T425", "E230", "6213", "5303"], ["8983", "T426", "E200", "6214", "5304"], ["8963", "T427", "E220", "", ""], ["8972", "T4281", "E252", "6220", "5307"], ["8982", "T429", "E240", "6216", "5305"], ["8952", "T430", "E610", "", ""], ["8954", "T431", "E600", "", ""], ["8917", "T4311", "E736", "", ""], ["8942", "T432", "E420", "6417", "5501"], ["8990", "T4321", "E241", "", ""], ["8965", "T433", "E440", "6419", "5502"], ["8943", "T4341", "E421", "", ""], ["8961", "T4342", "E571", "", ""], ["8977", "T4343", "E586", "", ""], ["8971", "T435", "E574", "6420", "5503"], ["8907", "T436", "E500", "6421", "5504"], ["8921", "T438", "E579", "6422", "5505"], ["8908", "T440", "E520", "6424", "5507"], ["8964", "T441", "E565", "6425", "5508"], ["8978", "T442", "E430", "6426", "5509"], ["8920", "T443", "E582", "6427", "5510"], ["8935", "T444", "E578", "6428", "5511"], ["8960", "T445", "E572", "6429", "5512"], ["8941", "T447", "E546", "", ""], ["8979", "T448", "E585", "", ""], ["PP60", "T451", "E601", "6632", "5701"], ["PP06", "T452", "E602", "6633", "5702"], ["PP05", "T453", "E603", "6634", "5703"], ["PP08", "T454", "E702", "", ""], ["PP63", "T455", "E709", "6635", "5704"], ["PP07", "T456", "E710", "6636", "5705"], ["PP65", "T457", "E708", "6637", "5706"], ["PP66", "T458", "E707", "6638", "5707"], ["PP10", "T459", "E704", "", ""], ["PP09", "T460", "E021", "6639", "5708"], ["PP67", "T461", "E020", "6640", "5709"], ["PP62", "T462", "E703", "", ""], ["PP61", "T465", "E701", "6646", "5713"], ["PP68", "T466", "E580", "", ""], ["PP64", "T468", "E706", "6647", "5714"], ["8985", "T471", "E320", "6555", "5601"], ["8986", "T472", "E330", "6556", "5602"], ["8992", "T473", "E340", "6557", "5603"], ["8987", "T474", "E350", "6558", "5604"], ["8988", "T475", "E360", "6559", "5605"], ["8993", "T476", "E370", "6560", "5606"], ["8989", "T477", "E390", "6561", "5607"], ["8981", "T479", "E441", "", ""], ["HE04", "T489", "E501", "6563", "5608"], ["8999", "T490", "E010", "6964", "5901"], ["8991", "T491", "E005", "6965", "5902"], ["1250", "T492", "092", "", ""], ["XR10", "T4000", "XR101", "6766", "5801"], ["XR11", "T4001", "XR102", "6767", "5802"], ["XR12", "T4002", "XR103", "6768", "5803"], ["XR13", "T4003", "XR104", "6769", "5804"], ["XR14", "T4004", "XR105", "6770", "5805"], ["XR15", "T4005", "XR106", "6771", "5806"], ["XR16", "T4006", "XR107", "6772", "5807"], ["XR17", "T4007", "XR108", "", ""], ["XR18", "T4008", "XR109", "", ""], ["SF18", "T4018", "AP18", "", ""], ["FX20", "T4020", "HA20", "", ""], ["FX21", "T4021", "HA21", "", ""], ["FX22", "T4022", "HA22", "", ""], ["FX23", "T4023", "HA23", "", ""], ["FX24", "T4024", "HA24", "", ""], ["FX25", "T4025", "HA25", "", ""], ["FX26", "T4026", "HA26", "", ""], ["CS31", "T4031", "CS31", "", ""], ["CS32", "T4032", "CS32", "", ""], ["CS33", "T4033", "CS33", "", ""], ["CS34", "T4034", "CS34", "", ""], ["CS35", "T4035", "CS35", "", ""], ["GF37", "T4037", "GF37", "", ""], ["HE05", "T4040", "E502", "", ""], ["HE07", "T4042", "E705", "", ""], ["LA05", "T4705", "AL05", "", ""], ["1135", "T510", "E050", "", ""], ["5000", "T494", "9910", "", ""], ["5050", "T495", "9940", "", ""], ["8909", "T449", "5530", "6430", "5514"]]};

const BRAND_COLORS = {
  'NEXA':'var(--c-nexa)',
  'PPG':'var(--c-ppg)',
  'MMY':'var(--c-mmy)',
  'QUIKLINE':'var(--c-quik)',
  'VALUE-PRO':'var(--c-value)'
};

document.getElementById('totalRows').textContent = DATA.rows.length;
document.getElementById('totalBrands').textContent = DATA.brands.length;

// legend
const legendGrid = document.getElementById('legendGrid');
DATA.brands.forEach(brand => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  const dot = document.createElement('span');
  dot.className = 'legend-dot';
  dot.style.background = BRAND_COLORS[brand] || 'var(--muted)';
  dot.style.color = BRAND_COLORS[brand] || 'var(--muted)';
  item.appendChild(dot);
  item.appendChild(document.createTextNode(brand));
  legendGrid.appendChild(item);
});

function normalize(s){
  return s.trim().toUpperCase().replace(/\s+/g,'');
}

function buscar(){
  const q = normalize(document.getElementById('searchInput').value);
  const card = document.getElementById('resultCard');
  const emptyMsg = document.getElementById('emptyMsg');

  if(!q){
    card.classList.remove('show');
    emptyMsg.classList.remove('show');
    return;
  }

  let foundRow = null, foundBrandIdx = -1;
  for(const row of DATA.rows){
    for(let i=0;i<row.length;i++){
      if(row[i] && normalize(row[i]) === q){
        foundRow = row;
        foundBrandIdx = i;
        break;
      }
    }
    if(foundRow) break;
  }

  if(!foundRow){
    card.classList.remove('show');
    emptyMsg.classList.add('show');
    return;
  }

  emptyMsg.classList.remove('show');
  document.getElementById('foundBrand').textContent = DATA.brands[foundBrandIdx];
  document.getElementById('foundRef').textContent = foundRow[foundBrandIdx];

  const list = document.getElementById('swatchList');
  list.innerHTML = '';
  DATA.brands.forEach((brand, i) => {
    const val = foundRow[i];
    const isMissing = !val;

    const swatch = document.createElement('div');
    swatch.className = 'swatch' + (isMissing ? ' missing' : '');

    const bar = document.createElement('div');
    bar.className = 'bar';
    if(!isMissing){
      const color = BRAND_COLORS[brand] || 'transparent';
      bar.style.background = color;
      swatch.style.boxShadow = '-1px 0 18px -4px ' + color;
    }

    const body = document.createElement('div');
    body.className = 'body';

    const name = document.createElement('span');
    name.className = 'brand-name';
    name.textContent = brand;

    const ref = document.createElement('span');
    ref.className = 'ref';
    ref.textContent = isMissing ? 'Sin contratipo' : val;

    body.appendChild(name);
    body.appendChild(ref);
    swatch.appendChild(bar);
    swatch.appendChild(body);
    list.appendChild(swatch);
  });

  card.classList.add('show');
}

document.getElementById('searchBtn').addEventListener('click', buscar);
document.getElementById('searchInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') buscar();
});
document.getElementById('searchInput').addEventListener('input', () => {
  if(document.getElementById('searchInput').value.trim() === ''){
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('emptyMsg').classList.remove('show');
  }
});

// Dictado por voz
const micBtn = document.getElementById('micBtn');
const micStatus = document.getElementById('micStatus');
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(SpeechRecognition){
  const recognition = new SpeechRecognition();
  recognition.lang = 'es-ES';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  let listening = false;

  recognition.addEventListener('start', () => {
    listening = true;
    micBtn.classList.add('listening');
    micStatus.classList.add('show');
  });

  recognition.addEventListener('end', () => {
    listening = false;
    micBtn.classList.remove('listening');
    micStatus.classList.remove('show');
  });

  recognition.addEventListener('result', e => {
    let texto = e.results[0][0].transcript;
    texto = texto.trim().replace(/\s+/g, '');
    document.getElementById('searchInput').value = texto;
    buscar();
  });

  recognition.addEventListener('error', () => {
    listening = false;
    micBtn.classList.remove('listening');
    micStatus.classList.remove('show');
  });

  micBtn.addEventListener('click', () => {
    if(listening){
      recognition.stop();
    } else {
      recognition.start();
    }
  });
} else {
  micBtn.addEventListener('click', () => {
    alert('Tu navegador no soporta dictado por voz. Prueba con Chrome.');
  });
  micBtn.style.opacity = '0.5';
}
</script>
</body>
</html>
